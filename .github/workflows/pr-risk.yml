name: PR Risk

on:
  pull_request:
    branches: ["main"]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pr-risk-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  report:
    name: Change risk comment
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # This repository runs the Action from its own pull request, so changes to it are tried out here first.
      - name: DevLens change risk
        uses: ./pr-risk
